name: CI

# Runs on every push and pull request to staging and main. The suite runs
# against a real PostgreSQL 16 service (the production database engine); the
# DB_* env vars below override phpunit.xml's in-memory SQLite default.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Docker Hub's official image, the one bkesari-platform's CI uses. This
        # was public.ecr.aws/docker/library/postgres:16 to dodge Docker Hub's
        # anonymous rate limit, until ECR Public refused every pull with "Data
        # limit exceeded" (2026-10-24). If Docker Hub's limit bites again,
        # mirror.gcr.io/library/postgres:16 is the next mirror to try.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: edu_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none

      - name: Install PHP dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Runs first, on the still-empty edu_test, so the check below means
      # something.
      - name: Tests (PostgreSQL)
        run: php artisan test

      # The step above would pass just as happily on SQLite if the DB_* env
      # ever stopped reaching the suite (phpunit.xml's <env> entries are not
      # forced, so real environment variables win). Check the service itself:
      # nothing else has touched edu_test yet, so an empty one means the
      # suite never did either.
      - name: Check the suite really used PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          tables=$(psql -h 127.0.0.1 -U postgres -d edu_test -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          echo "tables in edu_test: $tables"
          [ "$tables" -gt 0 ] || {
            echo "::error::edu_test is empty - the suite ran on SQLite, not the PostgreSQL service"
            exit 1
          }

      # Smoke-checks every migration and seeder against PostgreSQL, configured
      # the way a Neon server is: DB_URL for the app, DB_URL_UNPOOLED for
      # migrations. CI has no pooler, so both point at the service, but it
      # exercises the URL parsing and the direct-connection route. CI never
      # connects to Neon.
      - name: Migrate and seed (PostgreSQL, Neon-style URLs)
        run: php artisan migrate:fresh --seed --force
        env:
          BCRYPT_ROUNDS: 4
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/edu_test
          DB_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/edu_test

      # Hostinger has no Node.js, so public/build/ is committed and deployed
      # as-is. Check that the frontend builds and that the committed build is
      # what the current source produces (a stale one ships unstyled pages).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: Check the committed public/build is current
        run: |
          changes=$(git status --porcelain -- public/build)
          [ -z "$changes" ] || {
            echo "$changes"
            echo "::error::public/build is out of date - run npm run build and commit public/build"
            exit 1
          }
